name: pustaka

# Production (Coolify / VPS). Jalankan dari root repo:
#   cp .env.example docker/.env   # isi nilainya
#   docker compose -f docker/docker-compose.prod.yml --env-file docker/.env up -d --build
#
# Hanya frontend yang dipublikasikan; API & file diakses same-origin lewat rewrite Next
# (/api/v1, /uploads). Postgres, Redis, backend hanya di network internal.

x-backend-env: &backend-env
  NODE_ENV: production
  PORT: 3001
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379
  CORS_ORIGINS: ${PUBLIC_URL}
  PORTAL_URL: ${PUBLIC_URL}
  PUBLIC_API_URL: ${PUBLIC_URL}
  APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Jakarta}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?isi JWT_ACCESS_SECRET}
  JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
  REFRESH_TTL_DAYS: ${REFRESH_TTL_DAYS:-7}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://localhost:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-pustaka}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-}
  S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  MAIL_FROM: ${MAIL_FROM}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-openai/text-embedding-3-small}
  EMBEDDING_DIMS: ${EMBEDDING_DIMS:-1536}
  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    image: ${BACKEND_IMAGE:-pustaka-backend:latest}
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - uploads:/app/uploads
    # public = akses keluar (SMTP, OpenRouter, Open Library); tidak ada port dipublikasikan
    networks: [internal, public]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
      args:
        BACKEND_URL: http://backend:3001
    image: ${FRONTEND_IMAGE:-pustaka-frontend:latest}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:3001
    ports: ["${FRONTEND_PORT:-3000}:3000"]
    networks: [internal, public]
    depends_on:
      backend: { condition: service_healthy }

  backup:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_HOUR: ${BACKUP_HOUR:-19}
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      # ganti dengan path disk/NAS terpisah di server, mis. /mnt/backup/pustaka
      - ${BACKUP_PATH:-./backups}:/backups
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }

networks:
  internal:
    internal: true
  public: {}

volumes:
  pgdata:
  redisdata:
  uploads:
